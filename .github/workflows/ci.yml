name: CI

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-26, windows-latest]
        node: [24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npx biome ci
        if: matrix.os == 'ubuntu-latest'
      - run: npm test
      - run: npm run test:package

  # The default jobs run with store read caching on; keep the strict path working too.
  store-cache-off:
    runs-on: ubuntu-latest
    env:
      AGENT_PROFILES_STORE_CACHE: "off"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
