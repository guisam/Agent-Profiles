name: CI

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  check:
    # Windows is the slowest platform (#53): its tests run in three shards and its
    # package check in a fourth job, all in parallel. Other platforms run unsharded.
    name: check (${{ matrix.os }}, ${{ matrix.node }}${{ matrix.part != 'all' && format(', {0}', matrix.part) || '' }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-26]
        node: [24]
        part: [all]
        include:
          - { os: windows-latest, node: 24, part: tests 1/3, shard: 1/3 }
          - { os: windows-latest, node: 24, part: tests 2/3, shard: 2/3 }
          - { os: windows-latest, node: 24, part: tests 3/3, shard: 3/3 }
          - { os: windows-latest, node: 24, part: package }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
        if: matrix.part == 'all' || matrix.part == 'package'
      - run: npx biome ci
        if: matrix.os == 'ubuntu-latest'
      - run: npm test
        if: matrix.part == 'all'
      - run: npm test -- --test-shard=${{ matrix.shard }}
        if: matrix.shard
      - run: npm run test:package
        if: matrix.part == 'all' || matrix.part == 'package'

  # The default jobs run with store read caching on; keep the strict path working too.
  store-cache-off:
    runs-on: ubuntu-latest
    env:
      AGENT_PROFILES_STORE_CACHE: "off"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
